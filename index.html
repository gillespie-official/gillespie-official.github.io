const app = document.getElementById('app');
const filters = ['All ideas', 'For the Home', 'Wearables', 'Seasonal', 'Saved'];
let activeFilter = 'All ideas';
let query = '';
let saved = new Set();
let noticeTimer;
try {
    const stored = JSON.parse(localStorage.getItem('crochet-patterns-saved') || '[]');
    if (Array.isArray(stored)) saved = new Set(stored.filter(id => posts.some(post => post.id === id)));
} catch (_) { /* Browsing still works when storage is unavailable. */ }
function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
}
function notice(message) {
    clearTimeout(noticeTimer);
    document.getElementById('notice').textContent = message;
    noticeTimer = setTimeout(() => { document.getElementById('notice').textContent = ''; }, 4500);
}
function bookmark(post) {
    const selected = saved.has(post.id);
    return '<button type="button" class="bookmark" data-save="' + post.id + '" aria-pressed="' + selected + '" aria-label="' + (selected ? 'Unsave ' : 'Save ') + escapeHTML(post.title) + '"><span aria-hidden="true">' + (selected ? '♥' : '♡') + '</span></button>';
}
function updateSavedControls() {
    document.getElementById('saved-count').textContent = saved.size;
    document.querySelectorAll('[data-save]').forEach(button => {
        const post = posts.find(item => item.id === button.dataset.save);
        const selected = saved.has(post.id);
        button.setAttribute('aria-pressed', String(selected));
        button.setAttribute('aria-label', (selected ? 'Unsave ' : 'Save ') + post.title);
        button.firstElementChild.textContent = selected ? '♥' : '♡';
    });
}
function toggleSave(id) {
    const selected = saved.has(id);
    if (selected) saved.delete(id); else saved.add(id);
    let message = selected ? 'Removed from your saved ideas.' : 'Saved for your next crafting day.';
    try { localStorage.setItem('crochet-patterns-saved', JSON.stringify([...saved])); }
    catch (_) { message += ' Saved ideas will only last for this session because browser storage is unavailable.'; }
    updateSavedControls();
    if (activeFilter === 'Saved' && document.getElementById('pattern-grid')) renderCards();
    notice(message);
}
function card(post) {
    return '<article class="card"><div class="card-visual"><a class="card-image-link" href="#' + post.id + '" tabindex="-1" aria-hidden="true"><img class="card-image" src="' + post.image + '" alt="' + escapeHTML(post.alt) + '" loading="lazy" width="' + post.width + '" height="' + post.height + '"></a>' + bookmark(post) + '</div><div class="card-body"><div class="card-meta"><span class="category">' + post.category + '</span><span>•</span><time datetime="' + post.isoDate + '">' + post.date + '</time></div><h3><a href="#' + post.id + '">' + post.title + '</a></h3><p class="excerpt">' + escapeHTML(post.excerpt) + '</p></div><div class="card-bottom"><span>' + post.readMinutes + ' min read · Inspiration &amp; tips</span><a href="#' + post.id + '" aria-label="Read ' + escapeHTML(post.title) + '">Read the story ↗</a></div></article>';
}
function renderCards() {
    const grid = document.getElementById('pattern-grid');
    if (!grid) return;
    const terms = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
    const result = posts.filter(post => {
        const inCategory = activeFilter === 'All ideas' || (activeFilter === 'Saved' ? saved.has(post.id) : post.category === activeFilter);
        const haystack = [post.title, post.category, post.excerpt, ...post.tags].join(' ').toLowerCase();
        return inCategory && terms.every(term => haystack.includes(term));
    });
    document.getElementById('result-count').textContent = result.length + (result.length === 1 ? ' story' : ' stories') + ' to inspire your next project';
    document.querySelectorAll('[data-filter]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.filter === activeFilter)));
    grid.innerHTML = result.length ? result.map(card).join('') : '<div class="empty"><h3>' + (activeFilter === 'Saved' && !query ? 'Your next project is waiting.' : 'No matching ideas just yet.') + '</h3><p>' + (activeFilter === 'Saved' && !query ? 'Tap the heart on a story to keep it in your collection.' : 'Try another search or explore all four stories.') + '</p><button type="button" data-reset>Explore all ideas</button></div>';
}
function renderHome() {
    document.title = 'Crochet Patterns | A Little Inspiration, Stitch by Stitch';
    app.innerHTML = '<section class="wrap hero" aria-labelledby="home-title"><div class="hero-copy"><span class="eyebrow">For the love of making</span><h1 id="home-title" tabindex="-1">Your next cozy<br>project <em>starts here.</em></h1><p>A little yarn, a little curiosity, and something lovely made by you. Find fresh inspiration for your handmade life.</p><a class="primary" href="#patterns">Explore the collection <span aria-hidden="true">↗</span></a><div class="hero-footnote">Thoughtful ideas. Helpful tips. Endless possibilities.</div></div><div class="hero-art"><span class="art-note">a little handmade happiness ↘</span><figure class="photo-frame"><a href="#' + posts[2].id + '" aria-label="Explore the Dreamy Days shawl"><img src="' + posts[2].image + '" alt="' + escapeHTML(posts[2].alt) + '" width="' + posts[2].width + '" height="' + posts[2].height + '" fetchpriority="high"></a><figcaption>Color your everyday</figcaption></figure><figure class="photo-frame small"><a href="#' + posts[1].id + '" aria-label="Explore the flower potholder"><img src="' + posts[1].image + '" alt="' + escapeHTML(posts[1].alt) + '" width="' + posts[1].width + '" height="' + posts[1].height + '"></a><figcaption>Little things, big joy</figcaption></figure></div></section><div class="stitch-line"><div class="wrap stitch-inner"><span>Made with care</span><span>Inspired by color</span><span>One stitch at a time</span></div></div><section class="wrap collection" id="collection" aria-labelledby="collection-title"><div class="section-head"><div><span class="eyebrow">The inspiration edit</span><h2 id="collection-title">Find your next little joy.</h2></div><p id="result-count" role="status" aria-live="polite"></p></div><div class="collection-controls"><div class="filters" role="group" aria-label="Filter crochet ideas">' + filters.map(filter => '<button type="button" class="filter" data-filter="' + filter + '" aria-pressed="' + (activeFilter === filter) + '">' + filter + '</button>').join('') + '</div><label class="search"><span class="sr-only">Search crochet ideas</span><input id="search" type="search" placeholder="Find a little inspiration…" value="' + escapeHTML(query) + '"></label></div><div class="grid" id="pattern-grid"></div><aside class="studio-note"><span class="symbol" aria-hidden="true">✳</span><div><h3>A slower kind of happy.</h3><p>We believe in the joy of choosing your colors, trying something new, and making a little space for creativity. There is no rush. Just your next stitch.</p></div><a href="#about">Meet Crochet Patterns ↗</a></aside></section>';
    renderCards();
}
function renderPost(post) {
    document.title = post.title + ' | Crochet Patterns';
    app.innerHTML = '<div class="wrap detail-wrap"><a class="back-link" href="#patterns">← Back to the collection</a><article class="article-shell"><header class="article-top"><span class="eyebrow">' + post.category + ' · ' + post.readMinutes + ' min read</span><h1 tabindex="-1">' + post.title + '</h1><div class="article-byline"><img src="./assets/avatar-blog.png" alt="" width="32" height="32"><span>Crochet Patterns<br><time datetime="' + post.isoDate + '">' + post.date + '</time></span><div class="article-tools">' + bookmark(post) + '<button class="text-button" type="button" data-print>Print article</button></div></div></header><figure class="article-figure"><img src="' + post.image + '" alt="' + escapeHTML(post.alt) + '" width="' + post.width + '" height="' + post.height + '"><figcaption>Image credit and original inspiration: <a href="' + post.source + '" target="_blank" rel="noopener noreferrer">' + post.sourceLabel + ' ↗</a></figcaption></figure><div class="article-content">' + post.content + '</div></article><div class="article-end"><p>Keep a little inspiration for your next quiet afternoon.</p><a class="primary" href="#patterns">Explore more ideas ↗</a></div></div>';
}
function renderPage(page) {
    document.title = page.title + ' | Crochet Patterns';
    app.innerHTML = '<div class="wrap detail-wrap"><a class="back-link" href="#patterns">← Back to the collection</a><article class="article-shell"><header class="article-top"><span class="eyebrow">Crochet Patterns</span><h1 tabindex="-1">' + page.title + '</h1></header><div class="article-content">' + page.content + '</div></article></div>';
}
function route(event) {
    const id = location.hash.slice(1);
    if (id === 'app') { if (!app.innerHTML) renderHome(); app.focus({preventScroll:true}); return; }
    document.querySelectorAll('[data-nav]').forEach(link => {
        const current = link.dataset.nav === (id === '' || id === 'patterns' ? 'home' : id);
        if (current) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
    });
    if (!id || id === 'home' || id === 'patterns') {
        renderHome();
        if (id === 'patterns') document.getElementById('collection').scrollIntoView();
        else window.scrollTo({top:0,behavior:'instant'});
    } else if (Object.prototype.hasOwnProperty.call(pages,id)) {
        renderPage(pages[id]); window.scrollTo({top:0,behavior:'instant'});
    } else {
        const post = posts.find(item => item.id === id);
        if (post) renderPost(post);
        else renderPage({title:'That page is not in our collection.',content:'<p>Follow the link above to find crochet inspiration, project ideas, and practical tips.</p>'});
        window.scrollTo({top:0,behavior:'instant'});
    }
    const title = app.querySelector('h1');
    if (event && title && id !== 'patterns') title.focus({preventScroll:true});
    updateSavedControls();
}
document.addEventListener('click', event => {
    const saveButton = event.target.closest('[data-save]');
    if (saveButton) { toggleSave(saveButton.dataset.save); return; }
    const filterButton = event.target.closest('[data-filter]');
    if (filterButton) { activeFilter = filterButton.dataset.filter; renderCards(); return; }
    if (event.target.closest('[data-show-saved]')) {
        activeFilter = 'Saved'; query = '';
        if (location.hash === '#patterns') { renderHome(); document.getElementById('collection').scrollIntoView(); }
        else location.hash = 'patterns';
        return;
    }
    if (event.target.closest('[data-reset]')) {
        activeFilter = 'All ideas'; query = '';
        document.getElementById('search').value = '';
        renderCards();
        document.querySelector('[data-filter]').focus();
        return;
    }
    if (event.target.closest('[data-print]')) window.print();
});
document.addEventListener('input', event => {
    if (event.target.id === 'search') { query = event.target.value; renderCards(); }
});
window.addEventListener('hashchange', route);
route();

</script>
</body></html>
